<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SFS College Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated background -->
    <div class="bg-blobs">
        <span class="blob blob1"></span>
        <span class="blob blob2"></span>
        <span class="blob blob3"></span>
    </div>

    <div class="container">

        <div class="header">

            <img
                src="sfslogo.png"
                alt="SFS College Logo"
                class="logo"
            >

            <h1>SFS COLLEGE FORM</h1>

            <p class="subtitle">
                Student Information & Registration
            </p>

        </div>


        <form id="registrationForm" novalidate>

            <!-- STUDENT DETAILS -->

            <h2>Student Details</h2>


            <label for="name">
                Full Name *
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <small class="err" data-for="name"></small>


            <label for="email">
                Email *
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <small class="err" data-for="email"></small>


            <label for="mobile">
                Mobile No. *
            </label>

            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="10-digit mobile number"
                maxlength="10"
                inputmode="numeric"
                required
            >

            <small class="err" data-for="mobile"></small>


            <label for="rollNo">
                Roll No. *
            </label>

            <input
                type="text"
                id="rollNo"
                name="rollNo"
                placeholder="Enter your roll number"
                required
            >

            <small class="err" data-for="rollNo"></small>


            <label for="apaar">
                APAAR ID (ABC ID) *
            </label>

            <input
                type="text"
                id="apaar"
                name="apaar"
                placeholder="12-digit APAAR ID"
                maxlength="12"
                inputmode="numeric"
                required
            >

            <small class="err" data-for="apaar"></small>


            <label for="dob">
                Date of Birth *
            </label>

            <input
                type="date"
                id="dob"
                name="dob"
                required
            >

            <small class="err" data-for="dob"></small>


            <label for="aadhaar">
                Aadhaar ID *
            </label>

            <input
                type="text"
                id="aadhaar"
                name="aadhaar"
                placeholder="12-digit Aadhaar"
                maxlength="12"
                inputmode="numeric"
                required
            >

            <small class="err" data-for="aadhaar"></small>


            <label for="photo">
                Student Photo *
            </label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
                required
            >

            <p class="photo-note">
                Passport-size photo. Auto-compressed to under 1MB.
            </p>

            <small class="err" data-for="photo"></small>


            <!-- ACADEMIC DETAILS -->

            <h2>Academic Details</h2>


            <label for="stream">
                Select Stream *
            </label>

            <select
                id="stream"
                name="stream"
                required
            >
                <option value="">
                    -- Select Stream --
                </option>

                <option value="Science">
                    Science
                </option>

                <option value="Arts">
                    Arts
                </option>

            </select>

            <small class="err" data-for="stream"></small>


            <!-- SUBJECT DETAILS -->

            <div
                id="subjectSection"
                class="hidden"
            >

                <h2>Subject Details</h2>


                <label for="dsc1">
                    Subject 1 *
                </label>

                <select
                    id="dsc1"
                    name="dsc1"
                    required
                ></select>


                <label for="dsc2">
                    Subject 2 *
                </label>

                <select
                    id="dsc2"
                    name="dsc2"
                    required
                ></select>


                <label for="dsc3">
                    Subject 3 *
                </label>

                <select
                    id="dsc3"
                    name="dsc3"
                    required
                ></select>


                <small
                    class="err"
                    data-for="subjects"
                ></small>

            </div>


            <!-- NOMINEE DETAILS -->

            <h2>Nominee Details</h2>


            <label for="nomineeName">
                Nominee Name *
            </label>

            <input
                type="text"
                id="nomineeName"
                name="nomineeName"
                placeholder="Father / Mother / Brother / Sister"
                required
            >

            <small class="err" data-for="nomineeName"></small>


            <label for="nomineeDob">
                Nominee's Date of Birth *
            </label>

            <input
                type="date"
                id="nomineeDob"
                name="nomineeDob"
                required
            >

            <small class="err" data-for="nomineeDob"></small>


            <label for="nomineeMobile">
                Nominee's Mobile No. *
            </label>

            <input
                type="tel"
                id="nomineeMobile"
                name="nomineeMobile"
                placeholder="10-digit mobile"
                maxlength="10"
                inputmode="numeric"
                required
            >

            <small
                class="err"
                data-for="nomineeMobile"
            ></small>


            <label for="nomineeAadhaar">
                Nominee's Aadhaar No. *
            </label>

            <input
                type="text"
                id="nomineeAadhaar"
                name="nomineeAadhaar"
                placeholder="12-digit Aadhaar"
                maxlength="12"
                inputmode="numeric"
                required
            >

            <small
                class="err"
                data-for="nomineeAadhaar"
            ></small>


            <button
                type="submit"
                id="submitBtn"
            >
                Submit Registration
            </button>


            <p id="message"></p>

        </form>

    </div>


    <script src="script.js"></script>

</body>
</html>
